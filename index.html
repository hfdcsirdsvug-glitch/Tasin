<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7c3aed;--p2:#d946ef;--bg:#f2effd;--card:#fff;--tx:#1e1b3a;--mu:#6b6890;--line:#e8e4fa;--ok:#16a34a;--bad:#e11d48;--warn:#f59e0b;--blue:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Poppins',sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
a{color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1e1065,#6d28d9 55%,#c026d3);padding:20px}
.lc{width:100%;max-width:410px;background:rgba(255,255,255,.96);border-radius:28px;padding:34px;box-shadow:0 40px 90px rgba(0,0,0,.4)}
.lc h1{font-size:26px}.lc p{color:var(--mu);margin:4px 0 20px}
#shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#1e1065,#3b0f7a 60%,#701a75);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.br{display:flex;gap:10px;align-items:center;font-weight:700;font-size:19px;padding:6px 10px 20px}
.br i{font-style:normal;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#f0abfc);display:grid;place-items:center}
aside button{display:flex;width:100%;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:none;color:#e9e3ff;font-weight:500;margin-bottom:4px;text-align:left;position:relative}
aside button:hover{background:rgba(255,255,255,.1)}
aside button.on{background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.3)}
aside em{margin-left:auto;background:#fbbf24;color:#2a1800;font:700 12px Poppins;padding:1px 8px;border-radius:10px;font-style:normal}
main{padding:22px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px}.top small{color:var(--mu)}
.btn{display:inline-flex;gap:6px;align-items:center;padding:9px 16px;border-radius:12px;font-weight:600;background:var(--card);border:1px solid var(--line);transition:.2s}
.btn:hover{border-color:var(--p)}
.bp{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;box-shadow:0 8px 20px rgba(124,58,237,.35)}
.bd{background:#ffe4ea;color:var(--bad);border-color:#ffd0db}
.bs{padding:5px 11px;font-size:13px;border-radius:9px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(80,50,160,.07);border:1px solid var(--line);margin-bottom:18px}
.card h2{font-size:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:18px}
.st{padding:20px;border-radius:22px;color:#fff;position:relative;overflow:hidden}
.st:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.17);right:-30px;top:-40px}
.st small{opacity:.9}.st b{display:block;font:700 28px Poppins,'Hind Siliguri';margin-top:6px}
.g1{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.g2{background:linear-gradient(135deg,#f43f5e,#fb923c)}.g3{background:linear-gradient(135deg,#10b981,#06b6d4)}.g4{background:linear-gradient(135deg,#f59e0b,#ef4444)}.g5{background:linear-gradient(135deg,#ec4899,#8b5cf6)}.g6{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mu)}
.chart i{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#d946ef,#7c3aed);min-height:4px}
.chart b{color:var(--tx);font-size:13px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mu);text-align:left;padding:10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow:auto}
.th{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#eee}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.pending{background:#fef3c7;color:#b45309}.pill.confirmed{background:#dbeafe;color:#1d4ed8}.pill.shipped{background:#f3e8ff;color:#7e22ce}.pill.delivered{background:#dcfce7;color:#15803d}.pill.cancelled{background:#ffe4e6;color:#be123c}.pill.on{background:#dcfce7;color:#15803d}.pill.off{background:#eee;color:#666}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:13px;color:var(--mu);margin-bottom:5px;font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#faf9ff;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.f input[type=checkbox]{width:auto}.f input[type=color]{height:42px;padding:3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.fg .w{grid-column:1/-1}
#mod{position:fixed;inset:0;background:rgba(20,10,50,.55);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:16px}
#mod.on{display:grid}
.mb{background:#fff;border-radius:24px;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:24px}
.mb h2{margin-bottom:16px}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tb input,.tb select{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.oc{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:#fff}
.oc .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.oi{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}.oi img{width:40px;height:40px;border-radius:9px;object-fit:cover}
.sb{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sb button{padding:6px 12px;border-radius:10px;background:#f3f0ff;font-size:13px;font-weight:600}
.sb button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.bn{display:inline-block;background:#fff7ed;color:#c2410c;padding:2px 8px;border-radius:8px;font-size:12px}
.chat{display:grid;grid-template-columns:280px 1fr;gap:16px;height:70vh}
.cl{overflow:auto;border-right:1px solid var(--line);padding-right:10px}
.cl div{padding:10px;border-radius:12px;cursor:pointer;margin-bottom:4px}.cl div:hover,.cl div.on{background:#f3f0ff}
.cl small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl b em{background:var(--bad);color:#fff;font-style:normal;font-size:11px;padding:0 7px;border-radius:9px;margin-left:6px}
.cw{display:flex;flex-direction:column;min-height:0}
.cms{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.cms .m{max-width:75%;padding:9px 14px;border-radius:16px}
.m.u{background:#f3f0ff;align-self:flex-start}.m.a{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;align-self:flex-end}
.cs{display:flex;gap:8px;margin-top:10px}.cs input{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px}
.strip{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:20px;color:#fff;margin:14px 0;box-shadow:0 14px 34px -14px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);transition:.25s}
a.strip:hover{transform:translateY(-2px)}
.strip .si{font-style:normal;font-size:30px;flex:none}
.strip .stx{flex:1;min-width:0}
.strip .s1{font-weight:600;font-size:16px;line-height:1.55}
.strip .s1 b{color:#fde68a;font-weight:700}
.strip .pl{display:inline-block;background:#fff;color:var(--tc);padding:0 10px;border-radius:20px;font-weight:700;margin:0 2px}
.strip .s2{font-size:12.5px;opacity:.92;margin-top:2px;line-height:1.4}
.strip .sbtn{flex:none;background:#fff;color:var(--tc);padding:9px 20px;border-radius:30px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.2)}
@media(max-width:600px){.strip{flex-wrap:wrap;padding:12px 14px;gap:10px}.strip .si{font-size:24px}.strip .s1{font-size:14px}.strip .sbtn{margin-left:auto;padding:7px 16px;font-size:13px}}
.f input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:14px;background:#d9d4f3;position:relative;cursor:pointer;transition:.25s;padding:0;border:0}
.f input[type=checkbox]:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.f input[type=checkbox]:checked{background:linear-gradient(135deg,var(--p),var(--p2))}

#pv{margin-bottom:14px;padding:12px;border-radius:16px;background:#f7f5ff;border:1px dashed #cfc6f5}#pv .strip{margin:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);background:#1e1b3a;color:#fff;padding:12px 22px;border-radius:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}

#hb{font-size:28px;background:none;line-height:1;padding:2px 6px;color:#555}
#mtt{flex:1;font-weight:700;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f43f5e,#fb923c);color:#fff;font-weight:700;font-size:16px}
aside{position:fixed;left:0;top:0;height:100%;width:min(300px,84%);z-index:70;background:#fff;color:var(--tx);transform:translateX(-105%);transition:.35s cubic-bezier(.2,.8,.2,1);padding:0 0 24px;box-shadow:12px 0 40px rgba(0,0,0,.25)}
aside.on{transform:none}
aside .br{display:flex;color:var(--tx);padding:14px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
#sx{display:block;width:auto;margin:0 0 0 auto;font-size:24px;background:none;color:#777;padding:2px 8px}
#qa{display:flex;margin:0 14px 6px;width:calc(100% - 28px);justify-content:center;border:1px solid #bdb5e6;background:#fff;color:var(--tx);font-weight:700}
aside #menu button,aside #lo{color:#6b6890;margin:0 10px 2px;width:calc(100% - 20px)}
aside #menu button:hover{background:#f5f3ff}
aside #menu button.on{background:#f3f0ff;color:var(--p);box-shadow:none;font-weight:700}
aside #lo{background:#fff1f2;color:var(--bad);margin-top:18px}
.ml{color:#9a97b8;padding:14px 24px 6px}
#ascrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65;opacity:0;pointer-events:none;transition:.3s}
#ascrim.on{opacity:1;pointer-events:auto}
main{padding:14px}
.top{margin-bottom:14px}.top h1{font-size:21px}
.chat{grid-template-columns:1fr;height:auto}.cl{max-height:160px;border:0}

.stats{grid-template-columns:1fr 1fr;gap:12px}.st{padding:16px}.st b{font-size:22px}
.card{padding:14px;border-radius:16px}
}
